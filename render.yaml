# Render blueprint - client: Fancy Silk Store
# STATIC SITE - no backend service block. This repo is a static frontend only.
# Do NOT copy this file into another client's repo - each client repo has its
# own Render service.

services:
  - type: static_site
    name: fancy-silk-store
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    branch: client/fancy-silk-store
    envVars:
      # BUG 4.4: env var names are CASE-SENSITIVE on Render - keep these EXACTLY
      # as written (same names in .env.example and the Render dashboard).
      - key: VITE_SHOP_NAME
        value: Fancy Silk Store
      - key: VITE_SHOP_TAGLINE
        value: Punjabi suits, bridal wear, lehengas, sharara sets and designer suits
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2010"
      - key: VITE_SHOP_LOGO_PATH
        value: /favicon.ico
      - key: VITE_WHATSAPP_NUMBER
        value: "918699161743"
      - key: VITE_INSTAGRAM_HANDLE
        value: "fancy_silk_store_nakodar"
      - key: VITE_CONTACT_EMAIL
        value: "Not found"
      - key: VITE_WEBSITE_URL
        value: https://www.fancysilkstore.in/
      - key: VITE_GOOGLE_MAPS_URL
        value: "https://www.google.com/maps/search/?api=1&query=Fancy+Silk+Store+Malri+Road+Nakodar+Punjab"
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2010"
      - key: VITE_SHOP_STREET
        value: "Malri Road, near Advance Scanning Centre, Amardas Colony"
      - key: VITE_SHOP_LOCALITY
        value: "Nakodar"
      - key: VITE_SHOP_CITY
        value: "Nakodar"
      - key: VITE_SHOP_REGION
        value: "Punjab"
      - key: VITE_SHOP_POSTAL
        value: "144040"
      - key: VITE_SHOP_HOURS
        value: "Monday - Saturday 10:00 AM - 8:00 PM"
      - key: VITE_WHATSAPP_NUMBER
        value: "918699161743"
      - key: VITE_INSTAGRAM_HANDLE
        value: "fancy_silk_store_nakodar"
      - key: VITE_CONTACT_EMAIL
        value: "Not found"
      - key: VITE_WEBSITE_URL
        value: https://www.fancysilkstore.in/
      - key: VITE_GOOGLE_MAPS_URL
        value: "https://www.google.com/maps/search/?api=1&query=Fancy+Silk+Store+Malri+Road+Nakodar+Punjab"
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""