# Render blueprint - client: Dayal's Silks & Sarees
# STATIC SITE - no backend service block. This repo is a static frontend only.
# Do NOT copy this file into another client's repo - each client repo has its
# own Render service.

services:
  - type: static_site
    name: dayals-silks-sarees
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    branch: client/fancy-silk-store
    envVars:
      # BUG 4.4: env var names are CASE-SENSITIVE on Render - keep these EXACTLY
      # as written (same names in .env.example and the Render dashboard).
      - key: VITE_SHOP_NAME
        value: Dayal's Silks & Sarees
      - key: VITE_SHOP_TAGLINE
        value: Sarees, suits, ethnic wear and fabrics
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2010"
      - key: VITE_SHOP_LOGO_PATH
        value: /favicon.ico
      - key: VITE_WHATSAPP_NUMBER
        value: "919100014211"
      - key: VITE_INSTAGRAM_HANDLE
        value: "dayals_fashion"
      - key: VITE_CONTACT_EMAIL
        value: hello@dayals.com
      - key: VITE_WEBSITE_URL
        value: https://www.dayalsilks.com/
      - key: VITE_GOOGLE_MAPS_URL
        value: "https://www.google.com/maps/search/?api=1&query=Dayals+Silks+and+Sarees+Abids+Hyderabad"
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""
      - key: VITE_SHOP_FOUNDED_YEAR
        value: "2010"
      - key: VITE_SHOP_STREET
        value: "4/1/865, Moosa Building, Tilak Road"
      - key: VITE_SHOP_LOCALITY
        value: "Abids"
      - key: VITE_SHOP_CITY
        value: "Hyderabad"
      - key: VITE_SHOP_REGION
        value: "Telangana"
      - key: VITE_SHOP_POSTAL
        value: "500001"
      - key: VITE_SHOP_HOURS
        value: "Monday - Saturday 10:00 AM - 8:00 PM"
      - key: VITE_WHATSAPP_NUMBER
        value: "919100014211"
      - key: VITE_INSTAGRAM_HANDLE
        value: "dayals_fashion"
      - key: VITE_CONTACT_EMAIL
        value: "hello@dayals.com"
      - key: VITE_WEBSITE_URL
        value: "https://www.dayalsilks.com/"
      - key: VITE_GOOGLE_MAPS_URL
        value: "https://www.google.com/maps/search/?api=1&query=Dayals+Silks+and+Sarees+Abids+Hyderabad"
      - key: VITE_GOOGLE_MAPS_EMBED_URL
        value: ""